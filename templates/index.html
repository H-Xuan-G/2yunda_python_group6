<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ event_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ event_name }}</h1>
        <p class="description">{{ event_description }}</p>
        <p class="notice">📢 {{ event_notice }}</p>

        <div class="card">
            <h2>{{ welcome_text }}</h2>
            <p class="hint">{{ form_hint }}</p>

            <form action="/submit" method="post">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" name="name" placeholder="请输入你的姓名" required>
                </div>

                <div class="form-group">
                    <label for="group">所在小组 *</label>
                    <select id="group" name="group" required>
                        <option value="">-- 请选择小组 --</option>
                        {% for g in group_options %}
                        <option value="{{ g }}">{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="activity">活动方向 *</label>
                    <select id="activity" name="activity" required>
                        <option value="">-- 请选择活动方向 --</option>
                        {% for a in activity_options %}
                        <option value="{{ a }}">{{ a }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="reason">一句话说明</label>
                    <input type="text" id="reason" name="reason" placeholder="简单介绍一下你的选择理由（可选）">
                </div>

                <button type="submit" class="btn-submit">提交报名</button>
            </form>
        </div>

        <div class="footer-link">
            <a href="/result">查看报名统计 →</a>
        </div>
    </div>
</body>
</html>
